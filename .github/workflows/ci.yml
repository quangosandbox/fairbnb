name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://fairbnb:fairbnb@localhost:5432/fairbnb
  DATABASE_URL_UNPOOLED: postgresql://fairbnb:fairbnb@localhost:5432/fairbnb
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fairbnb
          POSTGRES_PASSWORD: fairbnb
          POSTGRES_DB: fairbnb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fairbnb" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Schema and migrations are in sync
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Seed demo data
        run: npm run db:seed
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test (search, sign up, book)
        run: |
          npm start &
          npx wait-on -t 60000 http://localhost:3000
          node tests/e2e/smoke.mjs
